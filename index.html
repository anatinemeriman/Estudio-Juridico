<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estúdio Jurídico | Em Breve</title>
    <style>
        /* Estilos Globais - Design Clean e Minimalista */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        body { 
            color: #ffffff; 
            background: linear-gradient(rgba(10, 25, 47, 0.95), rgba(23, 42, 69, 0.95)); 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            text-align: center;
            padding: 20px;
        }
        
        :root { --accent: #b38f4f; }

        .container { max-width: 600px; }
        
        .logo-placeholder { 
            font-size: 24px; 
            font-weight: bold; 
            letter-spacing: 2px; 
            color: #ffffff;
            margin-bottom: 30px;
        }
        .logo-placeholder span { color: var(--accent); }

        h1 { font-size: 36px; font-weight: 300; margin-bottom: 20px; letter-spacing: 0.5px; }
        
        .divider { width: 60px; height: 2px; background: var(--accent); margin: 20px auto; }
        
        p { font-size: 16px; color: #a8b2d1; max-width: 450px; margin: 0 auto 40px; line-height: 1.6; }
        
        .footer-note { font-size: 12px; color: #64748b; letter-spacing: 0.5px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- MARCA SUTIL E GENÉRICA -->
        <div class="logo-placeholder">ESTÚDIO JURÍDICO<span> • </span>ADVOCACIA</div>
        
        <!-- MENSAGEM PRINCIPAL -->
        <h1>Nova Perspectiva</h1>
        <div class="divider"></div>
        <p>Soluções fundamentadas na solidez tradicional do Direito Civil, impulsionadas pela eficiência, alta performance e inovação da inteligência jurídica digital.</p>
        
        <!-- STATUS -->
        <p style="color: var(--accent); font-weight: bold; font-size: 14px; letter-spacing: 1px;">NOVIDADES EM BREVE</p>
        
        <!-- NOTA DE RODAPÉ -->
        <div class="footer-note">&copy; 2026 Estúdio Jurídico. Todos os direitos reservados.</div>
    </div>

</body>
</html>
